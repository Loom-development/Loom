version: 1
name: loom-bun
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  app:
    type: node
    image: ${BUN_IMAGE:-ghcr.io/loom-development/loom-bun-1@sha256:1325194e28cff684e0d7a9ee26085516df897f18f363f4c05dbf4b3bd6b56b6d}
    userns: keep-id
    workdir: /workspace
    command: bun run dev
    ports:
      - "3004:3004"
    volumes:
      - ./:/workspace
    env:
      NODE_ENV: development
    healthcheck:
      command: bun -e "fetch('http://127.0.0.1:3004/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      intervalSeconds: 4
      timeoutSeconds: 4
      retries: 60
      startPeriodSeconds: 10
routes:
  - host: bun.loom.local
    service: app
    port: 3004
    https: true
