version: 1
name: loom-bun
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  app:
    type: node
    image: ${BUN_IMAGE:-ghcr.io/loom-development/loom-bun-1@sha256:4d640f6c2554c4ba738d1713dbec45be112cd59f6939d53fef7dc5ec78d9acda}
    userns: keep-id
    workdir: /workspace
    command: bun run dev
    ports:
      - "3004:3004"
    volumes:
      - ./:/workspace
    env:
      NODE_ENV: development
    healthcheck:
      command: bun -e "fetch('http://127.0.0.1:3004/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      intervalSeconds: 4
      timeoutSeconds: 4
      retries: 60
      startPeriodSeconds: 10
routes:
  - host: bun.loom.local
    service: app
    port: 3004
    https: true
