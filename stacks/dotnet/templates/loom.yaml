version: 1
name: loom-dotnet
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  app:
    type: dotnet
    image: ${DOTNET_IMAGE:-ghcr.io/loom-development/loom-dotnet-8@sha256:9dc76e1a67889eb32b9fab8b4665bc40cbb497fe2abe704d83fd7c5cc9ee53ec}
    userns: keep-id
    execUser: ${HOST_UID:-1000}:${HOST_GID:-1000}
    workdir: /workspace/src
    command: dotnet restore && dotnet run --urls http://0.0.0.0:5000
    ports:
      - "5000:5000"
    volumes:
      - ./:/workspace
    healthcheck:
      command: wget -qO /dev/null http://127.0.0.1:5000/ 2>/dev/null
      intervalSeconds: 5
      timeoutSeconds: 5
      retries: 60
      startPeriodSeconds: 30
routes:
  - host: dotnet.loom.local
    service: app
    port: 5000
    https: true
