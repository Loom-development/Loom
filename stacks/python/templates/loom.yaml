version: 1
name: python-example
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  app:
    type: python
    image: ${PYTHON_IMAGE:-ghcr.io/loom-development/loom-python-3.12@sha256:e31bbfb5c603a8609e6903a9f103c8386a363c5d60fe7690f6a4474e7e847055}
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    userns: keep-id
    workdir: /app
    command: sh -c 'if [ ! -f index.html ]; then printf "%s\n" "Loom Python example is running." > index.html; fi; exec python -m http.server 8000'
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    healthcheck:
      command: python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"
      intervalSeconds: 4
      timeoutSeconds: 4
      retries: 90
      startPeriodSeconds: 6
routes:
  - host: python.loom.local
    service: app
    port: 8000
    https: true
tasks:
  test:
    service: app
    command: pytest -q
