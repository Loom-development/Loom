version: 1
name: loom-rails7-hotwire
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  app:
    type: ruby
    image: ${RUBY_IMAGE:-docker.io/library/ruby:3.3.8}
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    userns: keep-id
    workdir: /workspace
    command: sh -c 'mkdir -p /tmp/loom-home/gems /tmp/loom-home/bundle /tmp/loom-home/bundle-config && export HOME=/tmp/loom-home GEM_HOME=/tmp/loom-home/gems GEM_PATH=/tmp/loom-home/gems PATH=/tmp/loom-home/gems/bin:$PATH BUNDLE_PATH=/tmp/loom-home/bundle BUNDLE_APP_CONFIG=/tmp/loom-home/bundle-config && gem install bundler -v 2.6.9 --no-document && bundle install && exec bin/rails server -b 0.0.0.0 -p 3008'
    ports:
      - "3008:3008"
    volumes:
      - ./:/workspace
    healthcheck:
      command: ruby -rsocket -e "TCPSocket.new('127.0.0.1', 3008).close"
      intervalSeconds: 4
      timeoutSeconds: 4
      retries: 150
      startPeriodSeconds: 10
routes:
  - host: rails7-hotwire.loom.local
    service: app
    port: 3008
    https: true
