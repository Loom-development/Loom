version: 1
name: loom-spring-react
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  backend:
    type: java
    image: ${JAVA_IMAGE:-ghcr.io/loom-development/loom-java-21@sha256:0137fa3f265b304b685757d5aea005a81140f833a49f271350b64bc0b349dedf}
    userns: keep-id
    execUser: ${HOST_UID:-1000}:${HOST_GID:-1000}
    workdir: /workspace/backend
    command: mvn spring-boot:run -Dspring-boot.run.jvmArguments="-Dserver.address=0.0.0.0 -Dserver.port=8080"
    ports:
      - "8081:8080"
    volumes:
      - ./:/workspace
  web:
    type: node
    image: ${NODE_IMAGE:-ghcr.io/loom-development/loom-node-22@sha256:038cf4b609c8c3802f75d5e90db02781e6edaa1cfc6391aa2834bde92075f744}
    userns: keep-id
    execUser: ${HOST_UID:-1000}:${HOST_GID:-1000}
    workdir: /workspace/frontend
    command: sh -c "npm install && npm run build && exec npm run serve"
    ports:
      - "5175:5175"
    volumes:
      - ./:/workspace
    dependsOn:
      - backend
    healthcheck:
      command: node -e "fetch('http://127.0.0.1:5175').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      intervalSeconds: 5
      timeoutSeconds: 5
      retries: 80
      startPeriodSeconds: 10
routes:
  - host: spring-react.loom.local
    service: web
    port: 5175
    https: true
