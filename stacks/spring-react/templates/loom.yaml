version: 1
name: loom-spring-react
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  backend:
    type: java
    image: ${JAVA_IMAGE:-ghcr.io/loom-development/loom-java-21@sha256:dd2c87a716b9f86d94cacc5db4b7b44ec3ba864f33ca3d6823461f84522dbe7e}
    userns: keep-id
    execUser: ${HOST_UID:-1000}:${HOST_GID:-1000}
    workdir: /workspace/backend
    command: mvn spring-boot:run -Dspring-boot.run.jvmArguments="-Dserver.address=0.0.0.0 -Dserver.port=8080"
    ports:
      - "8081:8080"
    volumes:
      - ./:/workspace
  web:
    type: node
    image: ${NODE_IMAGE:-ghcr.io/loom-development/loom-node-22@sha256:25823da1bec192be0882fa20a0838f576e2b6cc7e7aefbb1183ebc3cf1c924e6}
    userns: keep-id
    execUser: ${HOST_UID:-1000}:${HOST_GID:-1000}
    workdir: /workspace/frontend
    command: sh -c "npm install && npm run build && exec npm run serve"
    ports:
      - "5175:5175"
    volumes:
      - ./:/workspace
    dependsOn:
      - backend
    healthcheck:
      command: node -e "fetch('http://127.0.0.1:5175').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      intervalSeconds: 5
      timeoutSeconds: 5
      retries: 80
      startPeriodSeconds: 10
routes:
  - host: spring-react.loom.local
    service: web
    port: 5175
    https: true
