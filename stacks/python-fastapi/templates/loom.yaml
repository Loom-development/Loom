version: 1
name: python-fastapi-example
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  app:
    type: python
    image: ${PYTHON_IMAGE:-docker.io/library/python:3.12.11-slim}
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    userns: keep-id
    workdir: /workspace
    command: sh -c 'mkdir -p /tmp/loom-home/.local /tmp/loom-home/.cache/pip && export HOME=/tmp/loom-home PATH=/tmp/loom-home/.local/bin:$PATH PIP_CACHE_DIR=/tmp/loom-home/.cache/pip && pip install --disable-pip-version-check --user -r requirements.txt && exec uvicorn app.main:app --host 0.0.0.0 --port 8003'
    ports:
      - "8003:8003"
    volumes:
      - ./:/workspace
    healthcheck:
      command: python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=2)"
      intervalSeconds: 4
      timeoutSeconds: 4
      retries: 120
      startPeriodSeconds: 8
routes:
  - host: fastapi.loom.local
    service: app
    port: 8003
    https: true
tasks:
  test:
    service: app
    command: python -c "import app.main; print('fastapi app ok')"
