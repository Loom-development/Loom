version: 1
name: loom-db-elasticsearch
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  db:
    type: elasticsearch
    image: ${ELASTICSEARCH_IMAGE:-ghcr.io/loom-development/elasticsearch-8.19@sha256:e4797708584bd0df7c746b33a6640d243018a0ae8c8b088391c6f4675a3bef52}
    env:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
