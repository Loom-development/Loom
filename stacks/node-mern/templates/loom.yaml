version: 1
name: node-mern-example
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  api:
    type: node
    image: ${NODE_IMAGE:-docker.io/library/node:24.20.0-alpine}
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    userns: keep-id
    workdir: /workspace
    command: sh -c 'mkdir -p /tmp/loom-home && HOME=/tmp/loom-home npm install && HOME=/tmp/loom-home exec npm start'
    ports:
      - "3002:3002"
    volumes:
      - ./api:/workspace
    healthcheck:
      command: node -e "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      intervalSeconds: 4
      timeoutSeconds: 4
      retries: 80
      startPeriodSeconds: 5
  web:
    type: node
    image: ${NODE_IMAGE:-docker.io/library/node:24.20.0-alpine}
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    userns: keep-id
    dependsOn:
      - api
    workdir: /workspace
    command: sh -c 'mkdir -p /tmp/loom-home && HOME=/tmp/loom-home npm install && HOME=/tmp/loom-home exec npm start'
    ports:
      - "5173:5173"
    volumes:
      - ./web:/workspace
    healthcheck:
      command: node -e "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      intervalSeconds: 4
      timeoutSeconds: 4
      retries: 80
      startPeriodSeconds: 5
routes:
  - host: mern.loom.local
    service: web
    port: 5173
    https: true
tasks:
  test:
    service: api
    command: node -e "console.log('mern ok')"
