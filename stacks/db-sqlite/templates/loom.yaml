version: 1
name: loom-db-sqlite
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  db:
    type: sqlite
    image: ${SQLITE_IMAGE:-ghcr.io/loom-development/loom-sqlite-3@sha256:d5a81b6eabeeaab23aea3fe72333df9ecc59ef3b316e85037d3bbf8936ce6b28}
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    userns: keep-id
    entrypoint: ""
    command: sh -c "sqlite3 /data/loom.db 'select 1;' && tail -f /dev/null"
    workdir: /data
    volumes:
      - ./data/sqlite:/data
