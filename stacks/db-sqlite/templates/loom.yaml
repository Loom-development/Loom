version: 1
name: loom-db-sqlite
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  db:
    type: sqlite
    image: ${SQLITE_IMAGE:-ghcr.io/loom-development/loom-sqlite-3@sha256:fb5d256f745a6e26fc5a416e2491f33e02eaba00abd4d786f51a5c8e74667f07}
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    userns: keep-id
    entrypoint: ""
    command: sh -c "sqlite3 /data/loom.db 'select 1;' && tail -f /dev/null"
    workdir: /data
    volumes:
      - ./data/sqlite:/data
