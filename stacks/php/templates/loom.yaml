version: 1
name: php-example
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  app:
    type: php
    image: ${PHP_IMAGE:-ghcr.io/loom-development/loom-php@sha256:d9f67c2ee13bdc0f17cb836c435acb5787062311ac1843aa3ee4cb7ff11c799d}
    composer: false
    user: root
    userns: keep-id
    execUser: ${HOST_UID:-1000}:${HOST_GID:-1000}
    workdir: /app
    command: |
      set -eu
      target_uid="${HOST_UID:-1000}"
      target_gid="${HOST_GID:-1000}"
      current_gid="$(getent group www-data | cut -d: -f3)"
      if [ "$current_gid" != "$target_gid" ]; then
        if getent group "$target_gid" >/dev/null 2>&1; then
          existing_group="$(getent group "$target_gid" | cut -d: -f1)"
          usermod -g "$existing_group" www-data
        else
          groupmod -o -g "$target_gid" www-data
        fi
      fi
      current_uid="$(id -u www-data)"
      if [ "$current_uid" != "$target_uid" ]; then
        if getent passwd "$target_uid" >/dev/null 2>&1; then
          existing_user="$(getent passwd "$target_uid" | cut -d: -f1)"
          usermod -l loom-www-data -m -d /var/www -s /usr/sbin/nologin "$existing_user" >/dev/null 2>&1 || true
        fi
        usermod -o -u "$target_uid" www-data
      fi
      cat > /etc/apache2/sites-available/000-default.conf << 'APACHE_CONF'
      <VirtualHost *:80>
          DocumentRoot /app
          <Directory /app>
              Options FollowSymLinks
              AllowOverride All
              Require all granted
              FallbackResource /index.php
          </Directory>
          ErrorLog /dev/stderr
          CustomLog /dev/stdout combined
      </VirtualHost>
      APACHE_CONF
      a2enmod rewrite >/dev/null
      if [ ! -f /app/index.php ]; then
        printf '%s\n' '<?php echo "Loom PHP example is running.";' > /app/index.php
      fi
      exec apache2-foreground
    volumes:
      - ./:/app
    ports:
      - "8085:80"
    healthcheck:
      command: php -r "exit((int)!@fsockopen('127.0.0.1', 80));"
      intervalSeconds: 3
      timeoutSeconds: 3
      retries: 20
      startPeriodSeconds: 30
routes:
  - host: php.loom.local
    service: app
    port: 80
    https: true
tasks:
  test:
    service: app
    command: php -v
