version: 1
name: node-mean-example
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  api:
    type: node
    image: ${NODE_IMAGE:-ghcr.io/loom-development/loom-node-24@sha256:5bdb11d871f1cea2d5c20305e35d63ab199d23d9b8be69135fc615425f38420c}
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    userns: keep-id
    workdir: /workspace
    command: sh -c 'mkdir -p /tmp/loom-home && HOME=/tmp/loom-home npm install && HOME=/tmp/loom-home exec npm start'
    ports:
      - "3001:3001"
    volumes:
      - ./api:/workspace
    healthcheck:
      command: node -e "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      intervalSeconds: 4
      timeoutSeconds: 4
      retries: 80
      startPeriodSeconds: 5
  web:
    type: node
    image: ${NODE_IMAGE:-ghcr.io/loom-development/loom-node-24@sha256:5bdb11d871f1cea2d5c20305e35d63ab199d23d9b8be69135fc615425f38420c}
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    userns: keep-id
    dependsOn:
      - api
    workdir: /workspace
    command: sh -c 'mkdir -p /tmp/loom-home && HOME=/tmp/loom-home npm install && HOME=/tmp/loom-home exec npm start'
    ports:
      - "4200:4200"
    volumes:
      - ./web:/workspace
    healthcheck:
      command: node -e "fetch('http://127.0.0.1:4200').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      intervalSeconds: 4
      timeoutSeconds: 4
      retries: 80
      startPeriodSeconds: 5
routes:
  - host: mean.loom.local
    service: web
    port: 4200
    https: true
tasks:
  test:
    service: api
    command: node -e "console.log('mean ok')"
