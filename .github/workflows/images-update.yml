name: Image Updates

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: image-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install registry inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - name: Check pinned upstream metadata
        run: node scripts/images/check-updates.mjs images/catalog.json
      - id: changes
        name: Detect catalog changes
        run: |
          if git diff --quiet -- images/catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Update stable image metadata pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="automation/image-updates"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add images/catalog.json
          git commit -m "chore(images): refresh pinned upstream metadata"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          gh pr view "$BRANCH" --json url --jq .url || gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(images): refresh pinned upstream metadata" \
            --body "Refreshes digest metadata behind pinned upstream image tags. Version-tag changes remain explicit and reviewable."
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run images-ci.yml --ref "$BRANCH"
