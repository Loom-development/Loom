name: Image CI

on:
  pull_request:
    paths:
      - ".github/workflows/images-*.yml"
      - "images/**"
      - "scripts/images/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      custom: ${{ steps.matrix.outputs.custom }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - id: matrix
        name: Generate custom image matrix
        run: echo "custom=$(node scripts/images/matrix.mjs custom)" >> "$GITHUB_OUTPUT"

  custom-images:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.custom) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable emulation for linux/amd64 and linux/arm64
        uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64,arm64
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
      - name: Build catalog image
        run: node scripts/images/build.mjs "${{ matrix.name }}" --platform "${{ matrix.platform }}"
      - name: Run public image contract
        run: node scripts/images/test-image.mjs "${{ matrix.name }}" "localhost/${{ matrix.name }}:${{ matrix.version }}"
      - name: Export image for vulnerability scanning
        run: |
          podman save --format docker-archive \
            --output trivy-image.tar \
            "localhost/${{ matrix.name }}:${{ matrix.version }}"
      - name: Scan for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: trivy-image.tar
          format: json
          output: trivy-report.json
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 0
      - name: Enforce vulnerability policy
        run: node scripts/images/security-policy.mjs images/security-exceptions.json trivy-report.json
